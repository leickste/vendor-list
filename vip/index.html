<title>Stephen's VIP Page | Stephen Leick</title>

<style>
  :root{--navy:#14213d;--gold:#c9a227;--gold-ink:#9a7a17;--gold-light:#e9d9a6;--cream:#f6f1e7;--paper:#fffdf8;--ink:#1a2233;--muted:#5d6577;--line:#e4d9c6;--serif:Fraunces,ui-serif,Georgia,serif;--sans:Outfit,ui-sans-serif,system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  svg{width:16px;height:16px;flex:none}
  .page{max-width:512px;margin:0 auto;min-height:100dvh;background:var(--cream);box-shadow:0 0 0 1px rgba(20,33,61,.06);padding-bottom:calc(64px + 3rem + env(safe-area-inset-bottom))}
  header{position:relative;overflow:hidden;background:var(--navy);color:var(--cream);padding:max(1.25rem,env(safe-area-inset-top)) 20px 28px}
  header .glow{position:absolute;inset:0;pointer-events:none;opacity:.45;background:radial-gradient(circle at 100% 0%,rgba(201,162,39,.5),transparent 42%)}
  header .rel{position:relative}
  .top{display:flex;justify-content:space-between;align-items:center}
  .out{background:none;border:0;padding:4px 0;color:#fff;font-size:13px;font-weight:500;cursor:pointer}
  .back{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light)}
  .eyebrow{margin:20px 0 0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light)}
  h1{margin:6px 0 0;font-family:var(--serif);font-weight:500;font-size:2.6rem;line-height:.95;letter-spacing:-.025em}
  .sub{margin:12px 0 0;font-size:15px;color:rgba(255,255,255,.85)}
  .card{margin:20px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px}
  .card h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px}
  .card p{margin:6px 0 0;font-size:14px;color:var(--muted)}
  label{display:block;margin-top:16px;font-size:14px;font-weight:600}
  input{display:block;width:100%;height:48px;margin-top:8px;border-radius:18px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:16px}
  input:focus{outline:2px solid rgba(20,33,61,.25);outline-offset:1px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:12px;border-radius:16px;border:0;background:var(--navy);color:var(--cream);font-size:15px;font-weight:600;cursor:pointer}
  .btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .err{margin-top:10px;font-size:14px;color:#a3342b;display:none}
  .err.show{display:block}
  #vip{display:none}
  #vip.show{display:block}
  .vip-body{padding:0 20px}
  .vip-body section{margin-top:32px}
  .vip-body .k{margin:0;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}
  .vip-body h2{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
  .vip-body p{margin:10px 0 0;font-size:15px;color:var(--muted)}
  .vip-body .tile{display:block;margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px}
  .vip-body .tile.dark{background:var(--navy);border-color:var(--navy);color:var(--cream)}
  .vip-body .tile b{display:block;font-family:var(--serif);font-weight:400;font-size:21px}
  .vip-body .tile span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
  .vip-body .tile.dark span{color:rgba(255,255,255,.8)}
  .welcome{margin-top:20px !important;background:#fffaf0;border:1px solid #d9c27e;border-radius:22px;padding:16px 18px}
  .welcome h2{font-size:26px !important;margin-top:2px !important}
  .welcome p.t{margin-top:6px !important;font-size:14px !important}
  .vip-body .tile.ph{border-style:dashed;background:#fff}
  .vip-body .tile.ph b{color:var(--muted)}
  .vip-body .tile.soon{border-style:dashed;border-color:#cdb98a}
  .vip-body .tile .k{margin:0 0 2px}
  .vip-body .ask{font-size:14px;color:var(--ink)}
  .vip-body .ask a{font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .vip-body .tile.backlist{border-color:var(--gold);margin-top:0}
  .vip-body .tile.backlist b{color:var(--navy)}
  .qbox{background:var(--navy);color:var(--cream);border-radius:22px;padding:20px}
  .qbox h3{margin:0;font-family:var(--serif);font-weight:400;font-size:26px}
  .qbox p{margin:4px 0 0 !important;font-size:14px;color:rgba(255,255,255,.85) !important}
  .qbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .qbtns a{display:flex;align-items:center;justify-content:center;height:46px;border-radius:14px;font-weight:600;font-size:15px}
  .qcall{background:#fff;color:var(--navy)}
  .qtext{background:var(--gold);color:var(--navy)}
  .logout{margin:32px 20px 0}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,248,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:512px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:64px}
  nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--navy)}
  nav svg{width:20px;height:20px}
  @media (min-width:960px){ body{background:#efe8d9} .page{margin:32px auto;border-radius:28px;overflow:hidden;min-height:0;padding-bottom:40px} nav{display:none} }
</style>
<script>
/* Always start at the top after a refresh (links to #vendors still jump there). */
(function(){
  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
  var nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{};
  var reload = nav.type==='reload' || (performance.navigation&&performance.navigation.type===1);
  if(reload && location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  function top(){ if(reload || !location.hash) window.scrollTo(0,0); }
  top(); addEventListener('DOMContentLoaded',top); addEventListener('load',top);
  addEventListener('pageshow',function(e){ if(e.persisted) window.scrollTo(0,0); });
})();
</script>

const sms=(n,b)=>`sms:${n}${/iP(hone|ad|od)/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(b)}`;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(VAULT.salt), iterations:VAULT.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);

  return new TextDecoder().decode(plain);

function show(html){

  document.getElementById('out').hidden=false;

  document.getElementById('out').onclick=()=>{ try{localStorage.removeItem(KEY)}catch(e){} location.reload(); };
}
